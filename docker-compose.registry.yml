# Mismo sistema que docker-compose.yml: mismos servicios, mismo volumen,
# mismo healthcheck, mismo depends_on. Lo único que cambia son las dos
# líneas donde antes decía "build:" — acá dicen "image:" y apuntan a las
# imágenes ya publicadas en el registry. No necesita el código fuente para
# levantar, solo este archivo + el .env.
services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: habitos
      MYSQL_USER: habitos_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    image: ghcr.io/catalinarubies/habitos-backend:v0.1.0
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: habitos_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: habitos
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/catalinarubies/habitos-frontend:v0.1.0
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
