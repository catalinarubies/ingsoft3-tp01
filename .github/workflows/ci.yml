name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./backend
        run: npm ci

      # El "test" del package.json ya corre con --coverage y con
      # coverageThreshold configurado: si la cobertura no llega al umbral,
      # `npm test` termina con código de error y ESTE PASO falla, cortando
      # el job antes de llegar siquiera a construir la imagen Docker.
      - name: Tests + cobertura (backend)
        working-directory: ./backend
        run: npm test

      - name: Publicar resumen de cobertura
        if: always()
        working-directory: ./backend
        run: |
          {
            echo "## Cobertura — backend"
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              console.log('| Métrica | % |');
              console.log('|---|---|');
              console.log('| Líneas | ' + s.lines.pct + '% |');
              console.log('| Ramas | ' + s.branches.pct + '% |');
              console.log('| Funciones | ' + s.functions.pct + '% |');
            "
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/

      - uses: docker/setup-buildx-action@v3

      # Solo se entra al registry cuando el cambio llega a main. En un PR este
      # paso sale salteado: pasaron los tests y aun así no se publica.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Es el ULTIMO paso del job: se llega acá solo si los tests pasaron.
      # En un PR construye (valida el Dockerfile) pero no publica.
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/catalinarubies/habitos-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Tests + cobertura (frontend)
        working-directory: ./frontend
        run: npm test

      - name: Publicar resumen de cobertura
        if: always()
        working-directory: ./frontend
        run: |
          {
            echo "## Cobertura — frontend"
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              console.log('| Métrica | % |');
              console.log('|---|---|');
              console.log('| Líneas | ' + s.lines.pct + '% |');
              console.log('| Ramas | ' + s.branches.pct + '% |');
              console.log('| Funciones | ' + s.functions.pct + '% |');
            "
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/

      - uses: docker/setup-buildx-action@v3

      # Solo se entra al registry cuando el cambio llega a main. En un PR este
      # paso sale salteado: pasaron los tests y aun así no se publica.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Es el ULTIMO paso del job: se llega acá solo si los tests pasaron.
      # En un PR construye (valida el Dockerfile) pero no publica.
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/catalinarubies/habitos-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
  # ---------------------------------------------------------------------
  # CONTINUOUS DELIVERY: main verde -> QA automático -> PROD con aprobación
  # ---------------------------------------------------------------------

  # Solo corre en push a main y solo si los DOS jobs de build terminaron
  # bien (tests + imagen publicada). En un PR este job ni se crea.
  deploy-qa:
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qa
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    steps:
      # Se despliega la imagen con el SHA de ESTE commit: la misma que ya
      # pasó los tests. Render no reconstruye nada, solo la descarga.
      - name: Desplegar backend en QA
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          IMG="ghcr.io/catalinarubies/habitos-backend:${{ github.sha }}"
          ENC=$(printf %s "$IMG" | jq -sRr @uri)
          curl -fsS -X POST "${HOOK}&imgURL=${ENC}"

      - name: Desplegar frontend en QA
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          IMG="ghcr.io/catalinarubies/habitos-frontend:${{ github.sha }}"
          ENC=$(printf %s "$IMG" | jq -sRr @uri)
          curl -fsS -X POST "${HOOK}&imgURL=${ENC}"

      # El plan gratuito de Render duerme los servicios y tarda en
      # despertarlos, además del tiempo del deploy: por eso reintenta
      # (20 intentos x 15 s = hasta 5 minutos) en vez de fallar al primero.
      - name: Smoke test de QA (con reintentos)
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          check() {
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1" || true)
              echo "intento $i: $1 -> HTTP $code"
              if [ "$code" = "200" ]; then return 0; fi
              sleep 15
            done
            echo "::error::$1 no respondió 200 tras 20 intentos"
            return 1
          }
          check "$BACKEND_URL/health"
          check "$FRONTEND_URL/api/habitos"
          echo "QA OK con el commit ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  # El entorno "production" tiene un revisor requerido: el job queda en
  # "Waiting for review" hasta que alguien lo aprueba (o lo rechaza).
  # Solo se llega acá si deploy-qa, smoke test incluido, salió verde.
  deploy-prod:
    needs: deploy-qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Desplegar backend en PROD
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          IMG="ghcr.io/catalinarubies/habitos-backend:${{ github.sha }}"
          ENC=$(printf %s "$IMG" | jq -sRr @uri)
          curl -fsS -X POST "${HOOK}&imgURL=${ENC}"

      - name: Desplegar frontend en PROD
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          IMG="ghcr.io/catalinarubies/habitos-frontend:${{ github.sha }}"
          ENC=$(printf %s "$IMG" | jq -sRr @uri)
          curl -fsS -X POST "${HOOK}&imgURL=${ENC}"

      - name: Smoke test de PROD (con reintentos)
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          check() {
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1" || true)
              echo "intento $i: $1 -> HTTP $code"
              if [ "$code" = "200" ]; then return 0; fi
              sleep 15
            done
            echo "::error::$1 no respondió 200 tras 20 intentos"
            return 1
          }
          check "$BACKEND_URL/health"
          check "$FRONTEND_URL/api/habitos"
          echo "PROD OK con el commit ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"