name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./backend
        run: npm ci

      # El "test" del package.json ya corre con --coverage y con
      # coverageThreshold configurado: si la cobertura no llega al umbral,
      # `npm test` termina con código de error y ESTE PASO falla, cortando
      # el job antes de llegar siquiera a construir la imagen Docker.
      - name: Tests + cobertura (backend)
        working-directory: ./backend
        run: npm test

      - name: Publicar resumen de cobertura
        if: always()
        working-directory: ./backend
        run: |
          {
            echo "## Cobertura — backend"
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              console.log('| Métrica | % |');
              console.log('|---|---|');
              console.log('| Líneas | ' + s.lines.pct + '% |');
              console.log('| Ramas | ' + s.branches.pct + '% |');
              console.log('| Funciones | ' + s.functions.pct + '% |');
            "
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Tests + cobertura (frontend)
        working-directory: ./frontend
        run: npm test

      - name: Publicar resumen de cobertura
        if: always()
        working-directory: ./frontend
        run: |
          {
            echo "## Cobertura — frontend"
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              console.log('| Métrica | % |');
              console.log('|---|---|');
              console.log('| Líneas | ' + s.lines.pct + '% |');
              console.log('| Ramas | ' + s.branches.pct + '% |');
              console.log('| Funciones | ' + s.functions.pct + '% |');
            "
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend