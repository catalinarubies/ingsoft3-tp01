name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./backend
        run: npm ci

      # El "test" del package.json ya corre con --coverage y con
      # coverageThreshold configurado: si la cobertura no llega al umbral,
      # `npm test` termina con código de error y ESTE PASO falla, cortando
      # el job antes de llegar siquiera a construir la imagen Docker.
      - name: Tests + cobertura (backend)
        working-directory: ./backend
        run: npm test

      - name: Publicar resumen de cobertura
        if: always()
        working-directory: ./backend
        run: |
          {
            echo "## Cobertura — backend"
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              console.log('| Métrica | % |');
              console.log('|---|---|');
              console.log('| Líneas | ' + s.lines.pct + '% |');
              console.log('| Ramas | ' + s.branches.pct + '% |');
              console.log('| Funciones | ' + s.functions.pct + '% |');
            "
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/

      - uses: docker/setup-buildx-action@v3

      # Solo se entra al registry cuando el cambio llega a main. En un PR este
      # paso sale salteado: pasaron los tests y aun así no se publica.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Es el ULTIMO paso del job: se llega acá solo si los tests pasaron.
      # En un PR construye (valida el Dockerfile) pero no publica.
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/catalinarubies/habitos-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Tests + cobertura (frontend)
        working-directory: ./frontend
        run: npm test

      - name: Publicar resumen de cobertura
        if: always()
        working-directory: ./frontend
        run: |
          {
            echo "## Cobertura — frontend"
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              console.log('| Métrica | % |');
              console.log('|---|---|');
              console.log('| Líneas | ' + s.lines.pct + '% |');
              console.log('| Ramas | ' + s.branches.pct + '% |');
              console.log('| Funciones | ' + s.functions.pct + '% |');
            "
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/

      - uses: docker/setup-buildx-action@v3

      # Solo se entra al registry cuando el cambio llega a main. En un PR este
      # paso sale salteado: pasaron los tests y aun así no se publica.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Es el ULTIMO paso del job: se llega acá solo si los tests pasaron.
      # En un PR construye (valida el Dockerfile) pero no publica.
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/catalinarubies/habitos-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
  # ---------------------------------------------------------------------
  # CONTINUOUS DELIVERY: main verde -> QA automático -> PROD con aprobación
  # ---------------------------------------------------------------------

  # Solo corre en push a main y solo si los DOS jobs de build terminaron
  # bien (tests + imagen publicada). En un PR este job ni se crea.
  deploy-qa:
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qa
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    steps:
      # Se despliega la imagen con el SHA de ESTE commit: la misma que ya
      # pasó los tests. Render no reconstruye nada, solo la descarga.
      - name: Desplegar backend en QA
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          IMG="ghcr.io/catalinarubies/habitos-backend:sha-${{ github.sha }}"
          ENC=$(printf %s "$IMG" | jq -sRr @uri)
          curl -fsS -X POST "${HOOK}&imgURL=${ENC}"

      - name: Desplegar frontend en QA
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          IMG="ghcr.io/catalinarubies/habitos-frontend:sha-${{ github.sha }}"
          ENC=$(printf %s "$IMG" | jq -sRr @uri)
          curl -fsS -X POST "${HOOK}&imgURL=${ENC}"

      # El plan gratuito de Render duerme los servicios y tarda en
      # despertarlos, además del tiempo del deploy: por eso reintenta
      # (20 intentos x 15 s = hasta 5 minutos) en vez de fallar al primero.
      - name: Smoke test de QA (con reintentos)
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          check() {
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1" || echo 000)
              echo "intento $i: $1 -> HTTP $code"
              if [ "$code" = "200" ]; then return 0; fi
              sleep 15
            done
            echo "::error::$1 no respondió 200 tras 20 intentos"
            return 1
          }
          check "$BACKEND_URL/health"
          check "$FRONTEND_URL/api/habitos"
          echo "QA OK con el commit ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # PRUEBAS CONTRA QA YA DESPLEGADO: integración (API + base de verdad) y
  # e2e (navegador real). Su resultado decide si la MISMA imagen puede ir a PROD.
  # ---------------------------------------------------------------------

  # La API de QA, sin navegador y con la base de verdad. Va antes que la e2e:
  # si se rompe la API, esta queda roja y la e2e ni arranca; si se rompe solo
  # el front, esta queda verde y la e2e roja. Ese par dice quién se rompió.
  integracion:
    needs: deploy-qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # QA es una sola y la comparten todas las corridas: no se pisan.
    concurrency:
      group: qa-tests
      cancel-in-progress: false
    env:
      API_BASE_URL: https://habitos-backend-qa.onrender.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Integración contra la API de QA
        working-directory: ./frontend
        run: npx playwright test -c playwright.integracion.config.js

      - name: Resumen de la integración
        if: always()
        working-directory: ./frontend
        run: |
          node -e '
            let s;
            try { s = require("./resultados-integracion.json").stats; }
            catch (e) { console.log("## Integración contra QA: no se generó el resultado"); process.exit(1); }
            console.log("## Integración contra QA");
            console.log("");
            console.log(s.expected + " passed, " + s.unexpected + " failed, " + s.skipped + " skipped, " + s.flaky + " flaky");
            if (s.expected < 3 || s.unexpected > 0 || s.skipped > 0 || s.flaky > 0) process.exit(1);
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte de integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report-integracion/

  # El navegador real usa la app de QA completa (front -> nginx -> back -> base).
  e2e:
    needs: integracion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: qa-tests
      cancel-in-progress: false
    env:
      E2E_BASE_URL: https://habitos-frontend-qa.onrender.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Instalar el navegador
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: e2e contra QA
        working-directory: ./frontend
        run: npx playwright test -c playwright.e2e.config.js

      - name: Resumen de la e2e
        if: always()
        working-directory: ./frontend
        run: |
          node -e '
            let s;
            try { s = require("./resultados-e2e.json").stats; }
            catch (e) { console.log("## e2e contra QA: no se generó el resultado"); process.exit(1); }
            console.log("## e2e contra QA");
            console.log("");
            console.log(s.expected + " passed, " + s.unexpected + " failed, " + s.skipped + " skipped, " + s.flaky + " flaky");
            if (s.expected < 3 || s.unexpected > 0 || s.skipped > 0 || s.flaky > 0) process.exit(1);
          ' >> "$GITHUB_STEP_SUMMARY"

      # Se sube siempre, también cuando falla: trae captura y traza del fallo.
      - name: Subir reporte e2e
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report-e2e/

  # El entorno "production" tiene un revisor requerido: el job queda en
  # "Waiting for review" hasta que alguien lo aprueba (o lo rechaza).
  # Solo se llega acá si QA, la integración y la e2e salieron verdes (needs: e2e).
  deploy-prod:
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Desplegar backend en PROD
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          IMG="ghcr.io/catalinarubies/habitos-backend:sha-${{ github.sha }}"
          ENC=$(printf %s "$IMG" | jq -sRr @uri)
          curl -fsS -X POST "${HOOK}&imgURL=${ENC}"

      - name: Desplegar frontend en PROD
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          IMG="ghcr.io/catalinarubies/habitos-frontend:sha-${{ github.sha }}"
          ENC=$(printf %s "$IMG" | jq -sRr @uri)
          curl -fsS -X POST "${HOOK}&imgURL=${ENC}"

      - name: Smoke test de PROD (con reintentos)
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          check() {
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1" || echo 000)
              echo "intento $i: $1 -> HTTP $code"
              if [ "$code" = "200" ]; then return 0; fi
              sleep 15
            done
            echo "::error::$1 no respondió 200 tras 20 intentos"
            return 1
          }
          check "$BACKEND_URL/health"
          check "$FRONTEND_URL/api/habitos"
          echo "PROD OK con el commit ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"