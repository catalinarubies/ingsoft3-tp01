services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: habitos
      MYSQL_USER: habitos_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: habitos_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: habitos
      PORT: 3001
    ports:
      - "3001:3001" # para poder hacer curl/Postman directo al backend
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
