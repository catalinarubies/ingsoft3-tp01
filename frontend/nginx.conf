server {
    listen 80;

    # SPA: estáticos, con fallback a index.html para rutas que no son archivos reales
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que llegue a /api se reenvía al backend, por su nombre de
    # servicio dentro de la red de compose (definida en docker-compose.yml).
    #
    # El nombre va en una VARIABLE ($backend_api), no escrito directo en el
    # proxy_pass. Si estuviera escrito directo, nginx lo resolvería al
    # arrancar el contenedor — y si en ese momento el backend todavía no
    # existe, nginx se niega a levantar. Con variable, resuelve recién
    # cuando llega un pedido real.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:3001;

    location /api/ {
        proxy_pass $backend_api;
    }
}
